tools:
  - name: list_geometry
    description: List geometry entities in the active project.
    source_file: scripts/list_geometry.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: import_geometry
    description: Import an existing geometry file into the active project.
    source_file: scripts/import_geometry.py
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1}
        load_as_child: {type: boolean, default: false}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 600
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: true, deferred_hint: true}

  - name: set_current_geometry
    description: Make one named geometry entity current.
    source_file: scripts/set_current_geometry.py
    input_schema:
      type: object
      required: [geometry]
      properties: {geometry: {type: string, minLength: 1}}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: remove_geometry
    description: Remove one named geometry entity from the active project.
    source_file: scripts/remove_geometry.py
    input_schema:
      type: object
      required: [geometry]
      properties: {geometry: {type: string, minLength: 1}}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: false}

  - name: list_channels
    description: List channels on the selected or current geometry entity.
    source_file: scripts/list_channels.py
    input_schema:
      type: object
      properties: {geometry: {type: string, minLength: 1}}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: create_channel
    description: Create a paint channel with explicit dimensions and bit depth.
    source_file: scripts/create_channel.py
    input_schema:
      type: object
      required: [name, width, height, depth]
      properties:
        geometry: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        width: {type: integer, minimum: 1, maximum: 32768}
        height: {type: integer, minimum: 1, maximum: 32768}
        depth: {oneOf: [{type: string}, {type: integer}]}
        shader_stack: {type: boolean, default: false}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false, deferred_hint: true}

  - name: update_channel
    description: Update selected properties of one Mari channel.
    source_file: scripts/update_channel.py
    input_schema:
      type: object
      required: [channel]
      properties:
        geometry: {type: string, minLength: 1}
        channel: {type: string, minLength: 1}
        new_name: {type: string, minLength: 1}
        size: {type: integer, enum: [256, 512, 1024, 2048, 4096, 8192, 16384, 32768]}
        depth: {oneOf: [{type: string}, {type: integer}]}
        colorspace: {type: string, minLength: 1}
        locked: {type: boolean}
        make_current: {type: boolean}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: true}

  - name: remove_channel
    description: Remove one channel using a bounded Mari node-destruction strategy.
    source_file: scripts/remove_channel.py
    input_schema:
      type: object
      required: [channel]
      properties:
        geometry: {type: string, minLength: 1}
        channel: {type: string, minLength: 1}
        strategy: {type: string, enum: [none, unshared, all], default: unshared}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: false}
