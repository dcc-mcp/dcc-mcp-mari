tools:
  - name: list_nodes
    description: List nodes and available node type IDs for a geometry graph.
    source_file: scripts/list_nodes.py
    input_schema:
      type: object
      properties:
        geometry: {type: string, minLength: 1}
        selected_only: {type: boolean, default: false}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: create_node
    description: Create a typed graph node or a bounded paint node.
    source_file: scripts/create_node.py
    input_schema:
      type: object
      properties:
        geometry: {type: string, minLength: 1}
        type_id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        paint: {type: boolean, default: false}
        width: {type: integer, minimum: 1, maximum: 32768, default: 2048}
        height: {type: integer, minimum: 1, maximum: 32768, default: 2048}
        depth: {oneOf: [{type: string}, {type: integer}]}
        fill_color:
          type: array
          minItems: 3
          maxItems: 4
          items: {type: number}
        select: {type: boolean, default: false}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false, deferred_hint: true}

  - name: connect_nodes
    description: Connect or disconnect one destination input port.
    source_file: scripts/connect_nodes.py
    input_schema:
      type: object
      required: [destination_node, input_port]
      properties:
        geometry: {type: string, minLength: 1}
        destination_node: {type: string, minLength: 1}
        input_port: {type: string, minLength: 1}
        source_node: {type: string, minLength: 1}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: update_node
    description: Rename, select, or set bounded metadata on one node.
    source_file: scripts/update_node.py
    input_schema:
      type: object
      required: [node]
      properties:
        geometry: {type: string, minLength: 1}
        node: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        node_name: {type: string, minLength: 1}
        selected: {type: boolean}
        metadata: {type: object}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: remove_node
    description: Delete one node from a geometry graph.
    source_file: scripts/remove_node.py
    input_schema:
      type: object
      required: [node]
      properties:
        geometry: {type: string, minLength: 1}
        node: {type: string, minLength: 1}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: false}

  - name: list_layers
    description: List the active or selected channel's layer stack.
    source_file: scripts/list_layers.py
    input_schema:
      type: object
      properties:
        geometry: {type: string, minLength: 1}
        channel: {type: string, minLength: 1}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: create_layer
    description: Create a paint, group, graph, adjustment, or procedural layer.
    source_file: scripts/create_layer.py
    input_schema:
      type: object
      required: [name, layer_type]
      properties:
        geometry: {type: string, minLength: 1}
        channel: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        layer_type: {type: string, enum: [paint, group, graph, adjustment, procedural]}
        type_key: {type: string, minLength: 1}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false, deferred_hint: true}

  - name: update_layer
    description: Update bounded visibility, lock, selection, and blend properties.
    source_file: scripts/update_layer.py
    input_schema:
      type: object
      required: [layer]
      properties:
        geometry: {type: string, minLength: 1}
        channel: {type: string, minLength: 1}
        layer: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        visible: {type: boolean}
        locked: {type: boolean}
        selected: {type: boolean}
        blend_mode: {type: string, minLength: 1}
        blend_amount: {type: number, minimum: 0, maximum: 1}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: remove_layers
    description: Remove one or more named layers from a channel.
    source_file: scripts/remove_layers.py
    input_schema:
      type: object
      required: [layers]
      properties:
        geometry: {type: string, minLength: 1}
        channel: {type: string, minLength: 1}
        layers:
          type: array
          minItems: 1
          maxItems: 1000
          items: {type: string, minLength: 1}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 180
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: false}
