[build-system]
requires=["hatchling>=1.26"]
build-backend="hatchling.build"

[project]
name="dcc-mcp-mari"
version="0.2.1"
description="Production Mari adapter for DCC-MCP"
readme="README.md"
requires-python=">=3.9"
license={text="MIT"}
authors=[{name="loonghao",email="hal.long@outlook.com"}]
keywords=["mari","dcc","mcp","texture-painting","automation"]
classifiers=[
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies=["dcc-mcp-core>=0.19.91,<1.0.0"]

[project.urls]
Homepage="https://github.com/dcc-mcp/dcc-mcp-mari"
Repository="https://github.com/dcc-mcp/dcc-mcp-mari"
Issues="https://github.com/dcc-mcp/dcc-mcp-mari/issues"

[project.optional-dependencies]
test=["pytest>=8","ruff>=0.8","PyYAML>=6"]
dev=["pytest>=8","ruff>=0.8","PyYAML>=6","build>=1.2","twine>=6"]

[project.scripts]
dcc-mcp-mari="dcc_mcp_mari.server:main"

[project.entry-points."dcc_mcp.adapters"]
mari="dcc_mcp_mari:MariMcpServer"

[tool.hatch.build.targets.wheel]
packages=["src/dcc_mcp_mari"]
artifacts=["src/dcc_mcp_mari/skills/**"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src","."]

[tool.ruff.lint]
select=["E","F","I","B"]

[tool.ruff]
line-length=100
target-version="py39"
